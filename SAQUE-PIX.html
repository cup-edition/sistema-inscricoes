<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAQUE CUP EDITION</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 55%, #0f172a 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .caixa {
            background: #ffffff; padding: 32px 32px 8px; border-radius: 20px; width: 100%; max-width: 460px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.45); border: 2px solid #22c55e;
        }
        .topo {
            display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 8px;
        }
        .logo {
            width: 40px; height: 40px; border-radius: 12px;
            background: linear-gradient(135deg, #22d3ee, #3b82f6);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: white; font-size: 18px;
            box-shadow: 0 6px 16px rgba(59,130,246,0.4);
        }
        h2 {
            color: #ffffff; font-size: 32px; letter-spacing: 1px; font-weight: 900;
            background: linear-gradient(135deg, #22d3ee, #3b82f6);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 20px rgba(59,130,246,0.35);
        }
        .subtitulo { text-align: center; color: #6b7280; font-size: 13px; margin-bottom: 28px; }
        .grupo { margin-bottom: 20px; }
        label {
            display: block; margin-bottom: 8px; color: #374151; font-weight: 600; font-size: 13px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        input, select {
            width: 100%; padding: 14px 16px; border: 2px solid #e5e7eb; border-radius: 12px;
            font-size: 16px; color: #111827; background: #f9fafb; transition: all 0.2s ease;
            outline: none; appearance: none; -webkit-appearance: none;
            text-transform: uppercase;
        }
        select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
            background-repeat: no-repeat; background-position: right 16px center; padding-right: 44px;
            cursor: pointer;
        }
        option { text-transform: uppercase; }
        input::placeholder { color: #9ca3af; text-transform: uppercase; font-size: 12px; }
        #chave::placeholder { font-size: 11px; }
        input:focus, select:focus {
            border-color: #3b82f6; background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }
        .linha2 { display: flex; gap: 12px; }
        .linha2 .grupo { flex: 1; }
        .saldo-linha {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            background: #0f172a; border: 2px solid #e5e7eb; border-radius: 14px;
            padding: 12px 18px;
        }
        .saldo-linha label {
            margin: 0; color: #ffffff; font-weight: 700; font-size: 13px;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .saldo-linha input {
            width: auto; flex: 1; max-width: 160px; text-align: right;
            background: transparent !important; border: none; box-shadow: none;
            padding: 0; font-size: 22px; font-weight: 800; color: #94a3b8;
            cursor: not-allowed;
        }
        .saldo-linha input.saldo-positivo { color: #3b82f6; text-shadow: 0 0 12px rgba(59,130,246,0.4); }
        .saldo-moeda { font-size: 22px; font-weight: 800; color: #94a3b8; }
        .saldo-moeda.saldo-positivo { color: #3b82f6; text-shadow: 0 0 12px rgba(59,130,246,0.4); }
        .saldo-valor { font-size: 22px; font-weight: 800; color: #94a3b8; margin-left: 1px; }
        .saldo-valor.saldo-positivo { color: #3b82f6; text-shadow: 0 0 12px rgba(59,130,246,0.4); }
        button {
            width: 100%; padding: 15px; background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease; box-shadow: 0 6px 16px rgba(37,99,235,0.35);
            text-transform: uppercase;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 10px 20px rgba(37,99,235,0.45); }
        button:active { transform: translateY(0); }
        button:disabled { background: #93c5fd; cursor: not-allowed; box-shadow: none; transform: none; }
        .cinza {
            background: #f59e0b; color: #ffffff; box-shadow: none; margin-top: 10px; font-weight: 600;
        }
        .cinza:hover { background: #d97706; box-shadow: none; }
        .confirmacao {
            margin-top: 20px; padding: 20px; background: #f0f9ff; border: 1px solid #bae6fd;
            border-radius: 16px; display: none;
        }
        .confirmacao h3 {
            color: #0369a1; margin-bottom: 16px; font-size: 15px; text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .caixa-historico {
            margin-bottom: 0; padding: 8px 14px; background: #0f172a;
            border: 1px solid #22c55e; border-radius: 14px;
        }
        .caixa-historico h3 {
            color: #ffffff; margin-bottom: 6px; font-size: 13px; text-transform: uppercase;
            letter-spacing: 1px; font-weight: 800;
        }
        .hist-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 4px 0; border-bottom: 1px solid rgba(34,197,94,0.15);
            font-size: 13px;
        }
        .hist-item:last-child { border-bottom: none; }
        .hist-item .hist-data { color: #94a3b8; font-size: 12px; }
        .hist-item .hist-valor { color: #ffffff; font-weight: 800; }
        .hist-item .hist-status {
            color: #22c55e; font-weight: 800; font-size: 12px; margin-left: 10px;
        }
        .linha {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 0; border-bottom: 1px solid #e0f2fe;
        }
        .linha:last-of-type { border-bottom: none; }
        .linha span:first-child { color: #64748b; font-size: 13px; }
        .linha span:last-child { color: #0f172a; font-weight: 600; font-size: 14px; text-align: right; }
        .resultado {
            margin-top: 20px; padding: 18px; border-radius: 14px; display: none; white-space: pre-line;
            font-size: 14px; line-height: 1.7;
        }
        .sucesso {
            background: #f0fdf4; border: 1px solid #86efac; color: #14532d; display: block;
            box-shadow: 0 4px 12px rgba(34,197,94,0.15);
        }
        .erro {
            background: #fef2f2; border: 1px solid #fca5a5; color: #7f1d1d; display: block;
            box-shadow: 0 4px 12px rgba(239,68,68,0.15);
        }
        .rodape { margin-top: 24px; text-align: center; color: #9ca3af; font-size: 11px; }
        .logos-rodape { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 14px; }
        .logos-rodape img { height: 52px; width: auto; }
        .logos-rodape img:first-child { height: 46px; }
        .logos-rodape img:last-child { height: 46px; }

        @media (max-width: 420px) {
            .topo h2 { font-size: 30px; font-weight: 900; white-space: nowrap; }
        }

        /* ===== LOADING OVERLAY - MEIO DA TELA ===== */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            animation: fadeInOverlay 0.4s ease-out;
        }
        #loadingOverlay.ativo { display: flex; }
        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .loading-content {
            background: #1e293b;
            border-radius: 20px;
            padding: 40px 50px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            border: 2px solid #3b82f6;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            animation: scaleIn 0.5s ease-out;
            position: relative;
        }
        @keyframes scaleIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .loading-content .spinner-grande {
            width: 70px;
            height: 70px;
            border: 6px solid #334155;
            border-top: 6px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-content .titulo-loading {
            color: #f8f9fa;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .loading-content .subtitulo-loading {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 15px;
        }
        .loading-content .barra-progresso {
            width: 100%;
            height: 4px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }
        .loading-content .barra-progresso .progresso-interno {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #22c55e);
            border-radius: 4px;
            animation: progressBar 1.5s ease-in-out forwards;
        }
        @keyframes progressBar {
            0% { width: 0%; }
            50% { width: 60%; }
            100% { width: 100%; }
        }
        .loading-content .pontos-animados::after {
            content: '';
            animation: pontos 1.2s steps(3, end) infinite;
        }
        @keyframes pontos {
            0% { content: ''; }
            33% { content: '.'; }
            66% { content: '..'; }
            100% { content: '...'; }
        }
        .loading-content .icone-check {
            display: none;
            font-size: 60px;
            margin-bottom: 10px;
            animation: pulseCheck 0.6s ease-out;
        }
        @keyframes pulseCheck {
            0% { transform: scale(0); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .loading-content .icone-check.mostrar { display: block; }
        @media (max-width: 480px) {
            .loading-content { padding: 30px 25px; }
            .loading-content .titulo-loading { font-size: 18px; }
            .loading-content .subtitulo-loading { font-size: 13px; }
            .loading-content .spinner-grande { width: 50px; height: 50px; }
        }
        /* ===== FIM DO LOADING OVERLAY ===== */
    </style>
</head>
<body>
    <div class="caixa">
        <div class="topo">
            <h2>SAQUE CUP EDITION</h2>
        </div>
        <p class="subtitulo">SAQUES VIA PIX SEGUROS E INSTANTÂNEOS</p>

        <div id="caixaValidacao">
            <div class="grupo">
                <label>Nome</label>
                <select id="selNome" required>
                    <option value="">Selecione seu nome</option>
                </select>
            </div>

            <div class="grupo">
                <label>Data de Nascimento</label>
                <div class="linha2">
                    <div>
                        <select id="selDia" required>
                            <option value="">Dia</option>
                        </select>
                    </div>
                    <div>
                        <select id="selMes" required>
                            <option value="">Mês</option>
                        </select>
                    </div>
                </div>
            </div>

            <button id="btnValidar">Validar Acesso</button>
            <p class="rodape" id="msgValidacao" style="margin-top:12px; display:none;"></p>
        </div>

        <div id="caixaSaque" style="display:none;">
            <div style="display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:20px;">
                <div id="fotoCadastrado" style="width:52px; height:52px; border-radius:50%; overflow:hidden; border:2px solid #22c55e; flex-shrink:0;"></div>
                <div id="nomeCadastrado" style="font-size:18px; font-weight:700; color:#166534; text-transform:uppercase; text-align:left;"></div>
            </div>

            <div class="grupo" id="grupoValor">
            <div class="saldo-linha">
                <label>💵 SALDO DISPONÍVEL</label>
                <div style="display:flex; align-items:center; gap:0; flex:1; justify-content:flex-end;">
                    <span id="saldoR$" class="saldo-moeda">R$</span>
                    <span id="saldoValor" class="saldo-valor">0,00</span>
                    <input type="text" inputmode="numeric" id="valor" placeholder="0,00" maxlength="15" required readonly style="position:absolute; opacity:0; pointer-events:none; width:1px;">
                </div>
            </div>
        </div>

        <div class="grupo" id="grupoChave">
            <label>Chave Pix</label>
            <input type="text" id="chave" placeholder="DIGITE A CHAVE PIX" required>
        </div>

        <button id="btn1">Verificar</button>

        <div class="caixa-historico" id="caixaHistorico" style="display:none; margin-top:18px;">
            <h3>🕓 HISTÓRICO DE SAQUES</h3>
            <div id="listaHistorico"></div>
        </div>

        <div class="confirmacao" id="caixaConfirma">
            <h3>CONFIRME OS DADOS DO RECEBEDOR</h3>
            <div class="linha"><span>Valor</span><span id="mostraValor"></span></div>
            <div class="linha"><span>Chave</span><span id="mostraChave"></span></div>
            <div class="linha"><span>Tipo</span><span id="mostraTipo"></span></div>
            <div class="linha"><span>Titular</span><span id="mostraTitular"></span></div>
            <div class="linha"><span>CPF/CNPJ</span><span id="mostraCpf"></span></div>
            <div class="linha"><span>Instituição</span><span id="mostraBanco"></span></div>
            <button id="btnEnviar">SACAR ✅</button>
            <button id="btnVoltar" class="cinza">Alterar</button>
        </div>

        <div id="resultado" class="resultado"></div>
        </div>

        <p class="rodape">Cup Edition · Plataforma de pagamentos</p>
        <div class="logos-rodape">
            <img src="https://cup-edition.github.io/sistema-inscricoes/LOGO%20PIX.png" alt="Logo PIX">
            <img src="https://cup-edition.github.io/sistema-inscricoes/CUP%20EDITION%20CAMPIM%20FC.png" alt="Cup Edition Campim FC">
            <img src="https://cup-edition.github.io/campimfc/CUP%20EDITION%20PES.png" alt="Cup Edition PES">
        </div>
    </div>

    <!-- ===== LOADING OVERLAY - MEIO DA TELA ===== -->
    <div id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner-grande" id="spinnerLoading"></div>
            <div class="icone-check" id="iconeCheckLoading">✅</div>
            <div class="titulo-loading" id="tituloLoading">⏳ PROCESSANDO</div>
            <div class="subtitulo-loading" id="subtituloLoading">Aguarde, estamos processando seus dados<span class="pontos-animados"></span></div>
            <div class="barra-progresso">
                <div class="progresso-interno" id="barraProgressoLoading"></div>
            </div>
        </div>
    </div>
    <!-- ===== FIM LOADING OVERLAY ===== -->

    <script>
        const URL = 'https://cup-edition-api-saques.onrender.com/enviar-pix';
        const URL_CONSULTA = 'https://cup-edition-api-saques.onrender.com/consultar-chave';

        const firebaseConfig = {
            apiKey: "AIzaSyAR--VWkuPUBzKtJlEHPXnwBwbapB8JY_w",
            authDomain: "sistema-inscricoes-e9241.firebaseapp.com",
            databaseURL: "https://sistema-inscricoes-e9241-default-rtdb.firebaseio.com",
            projectId: "sistema-inscricoes-e9241",
            storageBucket: "sistema-inscricoes-e9241.firebasestorage.app",
            messagingSenderId: "232618438422",
            appId: "1:232618438422:web:1c62103b2169e64e862a37"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const refInscricoes = db.ref('inscricoes');

        const caixaValidacao = document.getElementById('caixaValidacao');
        const caixaSaque = document.getElementById('caixaSaque');
        const selNome = document.getElementById('selNome');
        const selDia = document.getElementById('selDia');
        const selMes = document.getElementById('selMes');
        const btnValidar = document.getElementById('btnValidar');
        const msgValidacao = document.getElementById('msgValidacao');

        let inscricoes = [];

        function mostrarLoadingOverlay(titulo, subtitulo) {
            const overlay = document.getElementById('loadingOverlay');
            const spinner = document.getElementById('spinnerLoading');
            const iconeCheck = document.getElementById('iconeCheckLoading');
            const tituloEl = document.getElementById('tituloLoading');
            const subtituloEl = document.getElementById('subtituloLoading');
            const barra = document.getElementById('barraProgressoLoading');

            if (titulo) tituloEl.textContent = titulo;
            if (subtitulo) subtituloEl.textContent = subtitulo;

            spinner.style.display = 'block';
            iconeCheck.classList.remove('mostrar');
            barra.style.animation = 'none';
            setTimeout(() => {
                barra.style.animation = 'progressBar 1.5s ease-in-out forwards';
            }, 10);

            overlay.classList.add('ativo');
        }

        function esconderLoadingOverlay(mostrarCheck = false) {
            const overlay = document.getElementById('loadingOverlay');
            const spinner = document.getElementById('spinnerLoading');
            const iconeCheck = document.getElementById('iconeCheckLoading');

            if (mostrarCheck) {
                spinner.style.display = 'none';
                iconeCheck.classList.add('mostrar');
                setTimeout(() => {
                    overlay.classList.remove('ativo');
                }, 600);
            } else {
                overlay.classList.remove('ativo');
            }
        }

        function atualizarTextoLoading(titulo, subtitulo) {
            const tituloEl = document.getElementById('tituloLoading');
            const subtituloEl = document.getElementById('subtituloLoading');
            if (titulo) tituloEl.textContent = titulo;
            if (subtitulo) subtituloEl.textContent = subtitulo;
        }

        for (let i = 1; i <= 31; i++) {
            const op = document.createElement('option');
            op.value = i;
            op.textContent = i;
            selDia.appendChild(op);
        }

        const nomesMes = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        for (let i = 1; i <= 12; i++) {
            const op = document.createElement('option');
            op.value = i;
            op.textContent = nomesMes[i - 1];
            selMes.appendChild(op);
        }

        selNome.addEventListener('change', function () {
            if (this.value) selDia.focus();
        });
        selDia.addEventListener('change', function () {
            if (this.value) selMes.focus();
        });
        selMes.addEventListener('change', function () {
            if (this.value) btnValidar.focus();
        });

async function carregarInscricoes() {
            try {
                const res = await fetch(firebaseConfig.databaseURL + '/inscricoes.json');
                const dados = await res.json();
                tratarInscricoes(dados);
            } catch (e) {
                msgValidacao.style.display = 'block';
                msgValidacao.style.color = '#dc2626';
                msgValidacao.textContent = 'ERRO AO CARREGAR INSCRIÇÕES: ' + e.message;
            }
        }

        function tratarInscricoes(dados) {
            inscricoes = Array.isArray(dados) ? dados : Object.values(dados || {});

            const nomes = [...new Set(inscricoes.map(i => i.nome).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'pt-BR'));
            nomes.forEach(nome => {
                const existe = [...selNome.options].some(op => op.value === nome);
                if (!existe) {
                    const op = document.createElement('option');
                    op.value = nome;
                    op.textContent = nome;
                    selNome.appendChild(op);
                }
            });

            atualizarValorSeAberto();
        }

        function atualizarValorSeAberto() {
            if (caixaSaque.style.display !== 'block' || !idCadastrado) return;
            const atualizado = inscricoes.find(i => i && i.id === idCadastrado);
            if (!atualizado) return;
            mostrarHistorico(atualizado);
            const valorDisponivel = (atualizado.valor !== undefined && atualizado.valor !== null && atualizado.valor !== '')
                ? Number(atualizado.valor).toFixed(2).replace('.', ',')
                : '0,00';
            campoValor.value = valorDisponivel;
            aplicarCorSaldo();
            const chaveInput = document.getElementById('chave');
            const semValor = Number(atualizado.valor || 0) <= 0;
            chaveInput.disabled = semValor;
            chaveInput.placeholder = semValor
                ? 'Sem valor disponível para saque'
                : 'CPF, CNPJ, e-mail, telefone ou chave aleatória';
            document.getElementById('btn1').disabled = semValor;
        }

refInscricoes.on('value', function (snap) {
            tratarInscricoes(snap.val());
        });

        btnValidar.onclick = function () {
            const nome = selNome.value;
            const dia = selDia.value;
            const mes = selMes.value;

            if (!nome || !dia || !mes) {
                msgValidacao.style.display = 'block';
                msgValidacao.style.color = '#dc2626';
                msgValidacao.textContent = 'SELECIONE NOME, DIA E MÊS PARA VALIDAR!';
                return;
            }

            mostrarLoadingOverlay('🔎 VALIDANDO ACESSO', 'Verificando seus dados');

            const encontrada = inscricoes.find(i =>
                i.nome === nome && String(i.dia) === String(dia) && String(i.mes) === String(mes)
            );

            if (encontrada) {
                atualizarTextoLoading('✅ ACESSO LIBERADO!', 'Bem-vindo');
                idCadastrado = encontrada.id;
                document.getElementById('nomeCadastrado').innerText = encontrada.nome;
                mostrarHistorico(encontrada);
                const fotoContainer = document.getElementById('fotoCadastrado');
                if (encontrada.foto) {
                    fotoContainer.innerHTML = '<img src="' + encontrada.foto + '" style="width:100%;height:100%;object-fit:cover;display:block;">';
                } else {
                    fotoContainer.innerHTML = '<div style="width:100%;height:100%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:22px;">📄</div>';
                }
                const valorDisponivel = (encontrada.valor !== undefined && encontrada.valor !== null && encontrada.valor !== '')
                    ? Number(encontrada.valor).toFixed(2).replace('.', ',')
                    : '0,00';
                campoValor.value = valorDisponivel;
                aplicarCorSaldo();
                document.getElementById('nomeCadastrado').innerText = encontrada.nome;
                const chaveInput = document.getElementById('chave');
                const semValor = Number(encontrada.valor || 0) <= 0;
                chaveInput.disabled = semValor;
                chaveInput.placeholder = semValor
                    ? 'Sem valor disponível para saque'
                    : 'CPF, CNPJ, e-mail, telefone ou chave aleatória';
                document.getElementById('btn1').disabled = semValor;
                msgValidacao.style.display = 'block';
                msgValidacao.style.color = '#059669';
                msgValidacao.textContent = '✅ ACESSO LIBERADO! BEM-VINDO, ' + nome + '.';
                caixaValidacao.style.display = 'none';
                caixaSaque.style.display = 'block';
                setTimeout(() => { esconderLoadingOverlay(true); }, 1200);
            } else {
                esconderLoadingOverlay(false);
                msgValidacao.style.display = 'block';
                msgValidacao.style.color = '#dc2626';
                msgValidacao.textContent = '❌ DADOS NÃO CONFEREM. VERIFIQUE NOME, DIA E MÊS DA SUA INSCRIÇÃO.';
            }
        };

        const btn1 = document.getElementById('btn1');
        const caixaConfirma = document.getElementById('caixaConfirma');
        const btnEnviar = document.getElementById('btnEnviar');
        const btnVoltar = document.getElementById('btnVoltar');
        const resultado = document.getElementById('resultado');
        const campoValor = document.getElementById('valor');
        const grupoValor = document.getElementById('grupoValor');
        const grupoChave = document.getElementById('grupoChave');

        campoValor.addEventListener('input', function () {
            let digitos = this.value.replace(/\D/g, '');
            if (!digitos) { this.value = ''; return; }
            digitos = digitos.padStart(3, '0');
            let reais = digitos.slice(0, -2).replace(/^0+(?=\d)/, '') || '0';
            const centavos = digitos.slice(-2);
            this.value = reais.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + centavos;
        });

        campoValor.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('chave').focus();
            }
        });

        document.getElementById('chave').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                btn1.click();
            }
        });

        let valor, chave, idCadastrado = null;

        function aplicarCorSaldo() {
            const campo = document.getElementById('valor');
            const moeda = document.getElementById('saldoR$');
            const valorSpan = document.getElementById('saldoValor');
            const num = parseFloat(String(campo.value).replace(/\./g, '').replace(',', '.'));
            const positivo = num > 0;
            if (valorSpan) valorSpan.textContent = campo.value || '0,00';
            campo.classList.toggle('saldo-positivo', positivo);
            if (moeda) moeda.classList.toggle('saldo-positivo', positivo);
            if (valorSpan) valorSpan.classList.toggle('saldo-positivo', positivo);
        }

        function mostrarHistorico(cadastro) {
            const caixaHist = document.getElementById('caixaHistorico');
            const listaHist = document.getElementById('listaHistorico');
            const historico = Array.isArray(cadastro.historico_saques) ? cadastro.historico_saques : [];

            if (historico.length === 0) {
                caixaHist.style.display = 'none';
                return;
            }

            let html = '';
            historico.forEach(s => {
                const d = new Date(s.data);
                const dataStr = String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
                html += `
                <div class="hist-item">
                    <span class="hist-data">${dataStr}</span>
                    <span style="display:flex; align-items:center;">
                        <span class="hist-valor">R$ ${Number(s.valor).toFixed(2).replace('.', ',')}</span>
                        <span class="hist-status">✓ APROVADO</span>
                    </span>
                </div>`;
            });
            listaHist.innerHTML = html;
            caixaHist.style.display = 'block';
        }

        btn1.onclick = async function () {
            valor = parseFloat(campoValor.value.replace(/\./g, '').replace(',', '.'));
            chave = document.getElementById('chave').value.trim();

            if (!valor || !chave) {
                resultado.className = 'resultado erro';
                resultado.innerText = 'PREENCHE TODOS OS CAMPOS!';
                resultado.style.display = 'block';
                return;
            }

            document.getElementById('mostraValor').innerText = 'R$ ' + valor.toFixed(2).replace('.', ',');
            document.getElementById('mostraChave').innerText = chave;
            resultado.style.display = 'none';

            btn1.disabled = true;
            btn1.innerText = 'Consultando chave...';
            mostrarLoadingOverlay('🔎 CONSULTANDO CHAVE', 'Buscando dados do recebedor');

            try {
                const res = await fetch(URL_CONSULTA + '?chave=' + encodeURIComponent(chave));
                const dados = await res.json();

                if (!res.ok || dados.erro) {
                    esconderLoadingOverlay(false);
                    resultado.className = 'resultado erro';
                    resultado.innerText = 'CHAVE NÃO ENCONTRADA OU INVÁLIDA: ' + (dados.erro || '');
                    resultado.style.display = 'block';
                    return;
                }

                document.getElementById('mostraTitular').innerText = dados.owner?.name || 'Não informado';
                document.getElementById('mostraCpf').innerText = dados.owner?.cpfCnpj || 'Não informado';
                document.getElementById('mostraTipo').innerText = dados.tipoDetectado || 'Não informado';
                document.getElementById('mostraBanco').innerText =
                    (dados.financialInstitution?.name || 'Não informado') +
                    (dados.financialInstitution?.code ? ' (Cód. ' + dados.financialInstitution.code + ')' : '');
                atualizarTextoLoading('✅ CHAVE ENCONTRADA!', 'Confira os dados do recebedor');
                caixaConfirma.style.display = 'block';
                grupoValor.style.display = 'none';
                grupoChave.style.display = 'none';
                btn1.style.display = 'none';
                setTimeout(() => { esconderLoadingOverlay(true); }, 1000);
            } catch (e) {
                esconderLoadingOverlay(false);
                resultado.className = 'resultado erro';
                resultado.innerText = 'FALHA AO CONSULTAR: ' + e.message;
                resultado.style.display = 'block';
            } finally {
                btn1.disabled = false;
                btn1.innerText = 'Verificar';
            }
        };

        btnVoltar.onclick = function () {
            caixaConfirma.style.display = 'none';
            resultado.style.display = 'none';
            grupoValor.style.display = 'block';
            grupoChave.style.display = 'block';
            btn1.style.display = 'block';
        };

        btnEnviar.onclick = async function () {
            btnEnviar.disabled = true;
            btnEnviar.innerText = 'Enviando...';
            resultado.style.display = 'none';
            mostrarLoadingOverlay('💸 ENVIANDO PIX', 'Processando seu saque');

            try {
                const res = await fetch(URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ valor, chavePix: chave })
                });

                const dados = await res.json();

                if (dados.sucesso) {
                    const t = dados.dados;
                    const b = t.bankAccount?.bank;
                    resultado.className = 'resultado sucesso';
                    resultado.innerText =
`✅ ENVIADO COM SUCESSO!

VALOR: R$ ${valor.toFixed(2).replace('.', ',')}
TITULAR: ${t.bankAccount?.ownerName || 'NÃO INFORMADO'}
CPF/CNPJ: ${t.bankAccount?.cpfCnpj || 'NÃO INFORMADO'}
BANCO: ${b?.name || 'NÃO INFORMADO'} (${b?.code || '---'})
ID: ${t.id}`;

                    if (idCadastrado) {
                        try {
                            const resBanco = await fetch(firebaseConfig.databaseURL + '/inscricoes.json');
                            const listaBanco = await resBanco.json();
                            const lista = Array.isArray(listaBanco) ? listaBanco : Object.values(listaBanco || {});
                            const item = lista.find(i => i && i.id === idCadastrado);
                            if (item) {
                                const disponivelAtual = Number(item.valor || 0);
                                item.valor = Math.max(0, disponivelAtual - valor);
                                const historico = Array.isArray(item.historico_saques) ? item.historico_saques : [];
                                historico.unshift({
                                    valor: valor,
                                    data: Date.now(),
                                    status: 'aprovado'
                                });
                                item.historico_saques = historico.slice(0, 3);
                                await fetch(firebaseConfig.databaseURL + '/inscricoes.json', {
                                    method: 'PUT',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(lista)
                                });
                            }
                        } catch (e) {
                            console.error('Erro ao atualizar saldo no banco:', e);
                        }
                    }

                    document.getElementById('valor').value = '';
                    document.getElementById('chave').value = '';
                    caixaConfirma.style.display = 'none';
                    grupoValor.style.display = 'none';
                    grupoChave.style.display = 'none';
                    btn1.style.display = 'none';
                    if (idCadastrado) {
                        const atualizado = inscricoes.find(i => i && i.id === idCadastrado);
                        if (atualizado) mostrarHistorico(atualizado);
                    }
                    atualizarTextoLoading('✅ PIX ENVIADO COM SUCESSO!', 'Seu dinheiro está a caminho');
                    setTimeout(() => { esconderLoadingOverlay(true); }, 1200);
                } else {
                    esconderLoadingOverlay(false);
                    resultado.className = 'resultado erro';
                    resultado.innerText = 'ERRO: ' + (dados.erro || 'Não foi possível enviar');
                }

            } catch (e) {
                esconderLoadingOverlay(false);
                resultado.className = 'resultado erro';
                resultado.innerText = 'FALHA: ' + e.message;
            } finally {
                resultado.style.display = 'block';
                btnEnviar.disabled = false;
                btnEnviar.innerText = 'SACAR ✅';
            }
        };

refInscricoes.on('value', function (snap) {
            tratarInscricoes(snap.val());
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'F12') { event.preventDefault(); return false; }
            if (event.ctrlKey) {
                if (event.shiftKey && (event.key === 'I' || event.key === 'i' || event.key === 'J' || event.key === 'j' || event.key === 'C' || event.key === 'c')) { event.preventDefault(); return false; }
                if (event.key === 'u' || event.key === 'U' || event.key === 's' || event.key === 'S') { event.preventDefault(); return false; }
            }
        });

        document.addEventListener('contextmenu', function (event) { event.preventDefault(); return false; });

        document.addEventListener('selectstart', function (event) { event.preventDefault(); return false; });

        document.addEventListener('dragstart', function (event) { event.preventDefault(); return false; });
    </script>
</body>
</html>
